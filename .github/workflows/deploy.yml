name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Sent by idmx when the spec changes on main or a spec draft is tagged.
  repository_dispatch:
    types: [idmx-spec-updated]
  # Safety net for missed dispatches.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check out idmx (spec source)
        if: vars.PUBLISH_SPEC == 'true'
        uses: actions/checkout@v5
        with:
          repository: idmx-project/idmx
          token: ${{ secrets.IDMX_READ_TOKEN || github.token }}
          path: .idmx
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          PUBLISH_SPEC: ${{ vars.PUBLISH_SPEC }}
          IDMX_REPO: .idmx
          IDMX_LATEST_REF: origin/main

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
